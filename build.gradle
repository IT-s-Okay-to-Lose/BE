buildscript { // Sentry
	repositories {
		mavenCentral()
	}
}

plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.0'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
}


dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-webflux'
	implementation 'org.springframework.boot:spring-boot-starter-websocket'

	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'

	implementation 'me.paulschwarz:spring-dotenv:2.3.0'
	implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310'

	implementation 'io.jsonwebtoken:jjwt-api:0.12.3'
	runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.3'
	runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.3'

	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.5.0'

	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'
	developmentOnly 'org.springframework.boot:spring-boot-devtools'
	runtimeOnly 'com.mysql:mysql-connector-j'

	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'io.projectreactor:reactor-test'
	testImplementation 'org.springframework.security:spring-security-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	// ✅ 테스트에서도 lombok 사용 가능하게 추가
	testCompileOnly 'org.projectlombok:lombok'
	testAnnotationProcessor 'org.projectlombok:lombok'
	//mac0s 전용
	implementation 'io.netty:netty-resolver-dns-native-macos:4.1.107.Final:osx-aarch_64'
}

tasks.named('test') {
	useJUnitPlatform()
	// 재현 테스트의 진단 출력(표)을 콘솔에서 보기 위해 stdout 을 노출한다.
	testLogging {
		showStandardStreams = true
		exceptionFormat = 'full'
		events 'passed', 'failed', 'skipped'
	}
	// 벤치마크 결과가 어느 실험 후보의 수치인지 표에 남기기 위해
	// -Dbench.variant 를 테스트 JVM 으로 전달한다.
	systemProperty 'bench.variant', System.getProperty('bench.variant', 'BASE(대책없음)')
	// 재현 컨텍스트와 실험 규모 파라미터를 테스트 JVM 으로 전달한다.
	['bench.branch', 'bench.commit', 'bench.pool', 'bench.isolation', 'bench.seed',
	 'c4.iterations', 'c7.seeds', 'c7.ops', 'c7.workers'].each { k ->
		if (System.getProperty(k) != null) { systemProperty k, System.getProperty(k) }
	}
}
