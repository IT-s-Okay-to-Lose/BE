# 거래 정합성 재현 테스트 전용 프로파일.
# 전체 ApplicationContext(OAuth/KIS/JWT placeholder)를 띄우지 않고
# JPA 슬라이스만으로 실제 MySQL(3307)에 붙기 위한 최소 설정.
spring:
  datasource:
    url: jdbc:mysql://localhost:3307/test_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul
    username: test_user
    password: test_pass
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      # 메인 비교 실험에서는 커넥션 풀 자체가 병목이 되지 않도록
      # 최대 요청 수(100)보다 충분히 크게 잡는다.
      # MySQL max_connections = 151 (실측)이므로 120 은 안전 범위.
      # pool=20 조건은 보조 실험(application-tradetest-pool20.yml)으로 분리한다.
      maximum-pool-size: ${BENCH_POOL_SIZE:120}
      minimum-idle: 10
      connection-timeout: 30000
      auto-commit: false

  jpa:
    hibernate:
      ddl-auto: none          # 운영 스키마(V1__init.sql)를 그대로 사용
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: false

  flyway:
    enabled: false

  sql:
    init:
      mode: never

logging:
  level:
    org.hibernate.SQL: "off"
    org.hibernate.orm.jdbc.bind: "off"
